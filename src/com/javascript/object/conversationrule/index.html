<!DOCTYPE html>
<html>
    <body>
        <script>
            let user = {
                name : "John",
                money : 1000,
                [Symbol.toPrimitive](hint){
                    alert(`hint: ${hint}`);
                    return hint == "string" ? `{name: "${this.name}"}` : this.money;
                }
            };

            //conversation demo:
            alert(user);
            alert(+user);
            alert(user + 500);
        </script>
    </body>
</html>
