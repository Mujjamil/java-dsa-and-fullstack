<!DOCTYPE html>
<html>
    <body>
        <h2>Math.random() program</h2>
        <p id="demo"></p>
        <script>
            let text;
            if(Math.random() < 0.5){
                text = "<a href='https://www.w3schools.com/js/tryit.asp?filename=tryjs_randomlink'>Visit W3</a>";
            }else{
                text = "<a href='https://www.mujjamiljamadar.com/'> Mj Website</a>"
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
