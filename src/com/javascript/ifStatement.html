<!DOCTYPE html>
<html>
    <body>
        <h1>Javascript if</h1>
        <p>Display Good day if the hours is more than 18:00</p>
        <p id="demo">Not good day</p>
        <script>
            if(new Date().getHours() < 18){
                document.getElementById('demo').innerHTML="Goody day Go on";
            }
        </script>
    </body>
</html>
